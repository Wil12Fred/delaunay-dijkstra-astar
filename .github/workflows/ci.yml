name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y freeglut3-dev xvfb
      - run: make
      # unit tests + the real program in both modes (OpenGL under xvfb-run)
      - run: make test
